<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7eee3">
  <meta name="description" content="A love letter for Angelie, celebrating five months together.">
  <title>A Letter for my baby Angelie — Five Months</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="letter-page">
  <main class="memory-stage" aria-label="A love letter for Angelie">
    <div class="letter-decorations" aria-hidden="true">
      <span class="floating-heart heart-one">♥</span><span class="floating-heart heart-two">♡</span>
      <span class="floating-heart heart-three">♥</span><span class="floating-heart heart-four">♡</span>
      <span class="floating-heart heart-five">♥</span><span class="floating-heart heart-six">♡</span>
      <span class="letter-berry berry-one"><i></i></span><span class="letter-berry berry-two"><i></i></span>
      <span class="letter-berry berry-three"><i></i></span><span class="letter-berry berry-four"><i></i></span>
    </div>
    <article class="letter-sheet" aria-labelledby="letter-title">
      <div class="letter-ornament" aria-hidden="true"><span>✿</span><i>♥</i><span>✿</span></div>
      <div class="letter-content">
        <p class="letter-salutation">My baby Angelie,</p>
        <h1 id="letter-title">Five months of choosing u</h1>
        <p class="letter-introduction" id="message-introduction"></p>
        <div class="letter-body" id="love-message" aria-live="polite"></div>
        <p class="letter-closing" id="signoff"></p>
        <p class="letter-signature" id="signature"></p>
      </div>
      <div class="letter-bottom-mark" aria-hidden="true">♡</div>
    </article>
    <div class="memory-photos" id="memory-photos" aria-label="Angelie's photos"></div>
  </main>
  <script src="message.js"></script>
  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
